<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jQuery Lab Work - Q15</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #road {
            width: 100%;
            height: 120px;
            background-color: #f0f0f0;
            border-bottom: 4px solid #333;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }
        #car {
            width: 80px;
            height: 40px;
            background-color: red;
            border-radius: 8px 18px 4px 4px;
            position: absolute;
            bottom: 10px;
            left: 0px;
            text-align: center;
            color: white;
            line-height: 40px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Animate Car (Forward, Stop, Reverse)</h2>

    <button id="moveForward">Forward</button>
    <button id="stopCar">Stop</button>
    <button id="moveReverse">Reverse</button>

    <div id="road">
        <div id="car">CAR</div>
    </div>

    <script>
        $(document).ready(function(){
            // Move Forward
            $("#moveForward").click(function(){
                $("#car").stop().animate({
                    left: '500px'
                }, 3000);
            });

            // Stop
            $("#stopCar").click(function(){
                $("#car").stop();
            });

            // Reverse
            $("#moveReverse").click(function(){
                $("#car").stop().animate({
                    left: '0px'
                }, 3000);
            });
        });
    </script>

</body>
</html>
