<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Lab Work - Q8</title>
</head>
<body>

    <h2>Real-Time Clock</h2>
    <h1 id="clock">00:00:00</h1>

    <script>
        function showClock() {
            var date = new Date();
            var hours = date.getHours();
            var minutes = date.getMinutes();
            var seconds = date.getSeconds();

            if (hours < 10) {
                hours = "0" + hours;
            }
            if (minutes < 10) {
                minutes = "0" + minutes;
            }
            if (seconds < 10) {
                seconds = "0" + seconds;
            }

            var timeString = hours + " : " + minutes + " : " + seconds;
            document.getElementById("clock").innerHTML = timeString;
        }

        setInterval(showClock, 1000);

        showClock();
    </script>

</body>
</html>
