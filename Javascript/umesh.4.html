<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Lab Work - Q4</title>
</head>
<body>

    <h2>Even Check or Find Difference</h2>

    <label for="num1">First Number: </label>
    <input type="number" id="num1"><br><br>

    <label for="num2">Second Number: </label>
    <input type="number" id="num2"><br><br>

    <button onclick="processNumbers()">Calculate</button>

    <h3 id="result"></h3>

    <script>
        function isEven(num) {
            if (num % 2 === 0) {
                return true;
            } else {
                return false;
            }
        }

        function findDifference(a, b) {
            return a - b;
        }

        function addNumbers(a, b) {
            return a + b;
        }

        function processNumbers() {
            var n1 = parseInt(document.getElementById("num1").value);
            var n2 = parseInt(document.getElementById("num2").value);

            if (isNaN(n1) || isNaN(n2)) {
                document.getElementById("result").innerHTML = "Please enter valid numbers.";
                return;
            }

            if (isEven(n1) && isEven(n2)) {
                var sum = addNumbers(n1, n2);
                document.getElementById("result").innerHTML = "Both numbers are even. Sum = " + sum;
            } else {
                var diff = findDifference(n1, n2);
                document.getElementById("result").innerHTML = "Both numbers are not even. Difference = " + diff;
            }
        }
    </script>

</body>
</html>
