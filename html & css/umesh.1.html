<!DOCTYPE html>
<html>

<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    font-family: Arial, sans-serif;
  }

  .margin-box {
    background-color: #e74c3c;
    padding: 20px;
    color: white;
    font-weight: bold;
  }

  .border-box {
    background-color: #f39c12;
    padding: 20px;
  }

  .padding-box {
    background-color: #3498db;
    padding: 20px;
  }

  .content-box {
    background-color: #2ecc71;
    padding: 30px;
    text-align: center;
  }
</style>

<body>

  <div class="margin-box">
    MARGIN
    <div class="border-box">
      BORDER
      <div class="padding-box">
        PADDING
        <div class="content-box">
          CONTENT
        </div>
      </div>
    </div>
  </div>

</body>
</html>
