<!DOCTYPE html>
<html>
<head>
    <title>CSS Display Properties</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
        }

        .container {
            background: white;
            width: 400px;
            padding: 15px;
            margin: 0 auto;
        }

        /* 1. Block: Takes full width and starts on a new line */
        .block {
            display: block;
            background: #4CAF50;
            color: white;
            padding: 10px;
            margin-bottom: 5px;
            text-align: center;
        }

        /* 2. Inline: Takes only content width, stays on same line */
        .inline {
            display: inline;
            background: #2196F3;
            color: white;
            padding: 5px;
        }

        /* 3. Inline-Block: Stays on same line, but allows setting width and height */
        .inline-block {
            display: inline-block;
            background: #ff9800;
            color: white;
            width: 100px;
            height: 50px;
            text-align: center;
            line-height: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>1. display: block</h3>
        <div class="block">Home</div>
        <div class="block">About</div>

        <h3>2. display: inline</h3>
        <span class="inline">HTML</span>
        <span class="inline">CSS</span>

        <h3>3. display: inline-block</h3>
        <div class="inline-block">Profile</div>
        <div class="inline-block">Contact</div>
    </div>

</body>
</html>
