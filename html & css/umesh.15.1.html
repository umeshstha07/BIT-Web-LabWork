<!DOCTYPE html>
<html>
<head>
    <title>Responsive Design - CSS Grid</title>
    <style>
        body {
            font-family: Arial;
            background: #f8f9fa;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
            grid-template-areas:
                "header  header header"
                "sidebar nav    ads"
                "sidebar main   ads"
                "footer  footer footer";
            gap: 10px;
            width: 600px;
            margin: 0 auto;
        }

        .box {
            border: 1px solid red;
            background: white;
            padding: 10px;
            text-align: center;
        }

        /* Area assignments */
        .header  { grid-area: header; }
        .sidebar { grid-area: sidebar; min-height: 200px; }
        .nav     { grid-area: nav; }
        .main    { grid-area: main; min-height: 150px; }
        .ads     { grid-area: ads; min-height: 200px; }
        .footer  { grid-area: footer; }

        /* Mobile View: Single Column Layout */
        @media (max-width: 600px) {
            .container {
                width: 100%;
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "nav"
                    "sidebar"
                    "main"
                    "ads"
                    "footer";
            }

            .sidebar, .ads { min-height: 60px; }
            .main { min-height: 150px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="box header">Header</header>
        <aside class="box sidebar">Sidebar</aside>
        <nav class="box nav">Navigation</nav>
        <main class="box main">Main</main>
        <aside class="box ads">Ads</aside>
        <footer class="box footer">Footer</footer>
    </div>

</body>
</html>
