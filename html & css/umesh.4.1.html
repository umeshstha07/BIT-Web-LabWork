<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .demo-box {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
    }

    button, input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      margin-right: 5px;
    }

    /* Target specific attribute value */
    [type="submit"] {
      background-color: #2ecc71;
      color: white;
    }
  </style>
</head>
<body>

  <div class="demo-box">
    <button type="button">Regular Button</button>
    <button type="submit">Submit Button</button>
    <input type="submit" value="Submit Input">
  </div>

</body>
</html>
