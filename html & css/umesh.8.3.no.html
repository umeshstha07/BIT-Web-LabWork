<!DOCTYPE html>
<html>
<head>
    <title>Background Repeat Example</title>
    <style>
        body {
            /* Loads the background image and repeats it horizontally across the page */
            background-image: url("image.jpg");
            background-repeat: repeat-x;
            font-family: Arial, sans-serif;
        }

        .content {
            width: 500px;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Hello World!</h1>
        <p>Here, the background image is repeated horizontally across the screen using repeat-x.</p>
        <p>In this example, text overlays directly above the repeated background pattern.</p>
    </div>

</body>
</html>
