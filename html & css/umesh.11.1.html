<!DOCTYPE html>
<html>
<head>
    <title>Facebook Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            text-align: center;
        }

        h1 {
            color: #1877f2;
        }

        .card {
            background: white;
            width: 300px;
            padding: 15px;
            margin: 0 auto;
            border: 1px solid #ccc;
        }

        input {
            width: 90%;
            padding: 8px;
            margin-bottom: 10px;
        }

        .btn-blue {
            background: #1877f2;
            color: white;
            width: 95%;
            padding: 8px;
            border: none;
        }

        .btn-green {
            background: #42b72a;
            color: white;
            padding: 8px;
            border: none;
        }

        a {
            display: block;
            margin: 10px 0;
            color: #1877f2;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>facebook</h1>

    <div class="card">
        <h3>Log in to Facebook</h3>
        <input type="text" placeholder="Email or phone"><br>
        <input type="password" placeholder="Password"><br>
        <button class="btn-blue">Log In</button>
        <a href="#">Forgotten account?</a>
        <hr>
        <button class="btn-green">Create new account</button>
    </div>

</body>
</html>
