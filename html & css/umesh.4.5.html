<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .demo-box {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
    }

    img {
      width: 100px;
      height: 60px;
      object-fit: cover;
      margin-right: 5px;
    }

    /* Target attribute ending with specified value */
    [src$=".jpg"] {
      border: 3px solid #f39c12;
    }
  </style>
</head>
<body>

  <div class="demo-box">
    <img src="mountain.jpg" alt="Mountain">
    <img src="kayak.jpg" alt="Kayak">
    <img src="lake.jpg" alt="Lake">
  </div>

</body>
</html>
