<!DOCTYPE html>
<html>
<head>
    <title>CSS Float Property</title>
    <style>
        body {
            font-family: Arial;
            background: #f8f9fa;
        }

        h2 {
            margin-bottom: 2px;
        }

        .container {
            width: 300px;
            height: 120px;
            border: 2px solid black;
            background: #a0cbe8;
            padding: 10px;
            margin-top: 2px;
        }

        /* 1. Float Left: Aligns box to the left */
        .left {
            float: left;
            width: 100px;
            height: 80px;
            background: #90ee90;
            text-align: center;
        }

        /* 2. Float Right: Aligns box to the right */
        .right {
            float: right;
            width: 100px;
            height: 80px;
            background: #ffffcc;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Float Left and Right</h2>
    <div class="container">
        <div class="left">Float Left</div>
        <div class="right">Float Right</div>
    </div>

</body>
</html>
