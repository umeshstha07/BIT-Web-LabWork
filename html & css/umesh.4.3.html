<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .demo-box {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
    }

    p {
      margin: 10px 0;
      padding-bottom: 5px;
    }

    /* Target attribute starting with value followed by hyphen */
    [lang|="en"] {
      border-bottom: 2px dotted #3498db;
    }
  </style>
</head>
<body>

  <div class="demo-box">
    <p lang="en">English content</p>
    <p lang="en-us">American English content</p>
    <p lang="en-gb">British English content</p>
    <p lang="fr">French content (not selected)</p>
  </div>

</body>
</html>
