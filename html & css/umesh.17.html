<!DOCTYPE html>
<html>
<head>
    <title>Mobile Layout - Flexbox</title>
    <style>
        body {
            font-family: Arial;
            background: #f8f9fa;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 320px;
            margin: 0 auto;
        }

        .box {
            border: 1px solid red;
            background: white;
            padding: 10px;
            text-align: center;
        }

        .main {
            height: 150px;
        }

        .sidebar, .ads {
            height: 60px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="box">Header</header>
        <nav class="box">Navigation</nav>
        <main class="box main">Main</main>
        <aside class="box sidebar">Sidebar</aside>
        <aside class="box ads">Ads</aside>
        <footer class="box">Footer</footer>
    </div>

</body>
</html>
