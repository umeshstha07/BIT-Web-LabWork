<!DOCTYPE html>
<html>
<head>
    <title>Background Property</title>
    <style>
        body {
            font-family: Arial;
            background: #f8f9fa;
        }

        .card {
            border: 1px solid red;
            background: white;
            width: 400px;
            height: 300px;
            padding: 15px;
            margin: 0 auto;
            background-image: url('image.jpg');
            background-size: cover;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello World!</h1>
        <p>This paragraph demonstrates how a background image is set on a container element.</p>
        <p>The image covers the full card without repeating, keeping the layout clean and simple.</p>
    </div>

</body>
</html>
