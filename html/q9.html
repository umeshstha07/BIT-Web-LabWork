<!DOCTYPE html>
<html>
<head>
    <title>Designing  table</title>
</head>
<body>

    <table>
        <tr>
            <td valign="top">
                <!-- Left Table: Programming Language -->
                <h3 align="center">Programming Language</h3>
                <table border="5" cellpadding="5">
                    <tr>
                        <th colspan="2">Language and Framworks</th>
                    </tr>
                    <tr>
                        <td>Python</td>
                        <td>Django</td>
                    </tr>
                    <tr>
                        <td rowspan="2">Javascript</td>
                        <td>React.js</td>
                    </tr>
                    <tr>
                        <td>Vue.js</td>
                    </tr>
                    <tr>
                        <td>Ruby</td>
                        <td>Ruby on Rails</td>
                    </tr>
                </table>
            </td>

            <td width="30"></td> <!-- Spacer between tables -->

            <td valign="top">
                <!-- Right Table: Student Result -->
                <h3 align="center">Student Result</h3>
                <table border="1" cellpadding="5" cellspacing="0">
                    <tr>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>Marks</th>
                    </tr>
                    <tr>
                        <td rowspan="2">Sabin</td>
                        <td>Advanced<br>Web</td>
                        <td>75</td>
                    </tr>
                    <tr>
                        <td>OS</td>
                        <td>60</td>
                    </tr>
                    <tr>
                        <td rowspan="2">Sujan</td>
                        <td>Advanced<br>Web</td>
                        <td>80</td>
                    </tr>
                    <tr>
                        <td>OS</td>
                        <td>75</td>
                    </tr>
                    <tr>
                        <td colspan="3" align="center">Total Average = 72.5</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
