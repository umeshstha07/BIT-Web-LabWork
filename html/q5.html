<!DOCTYPE html>
<html>
<head>
    <title>use of figure,img,figcaption tag</title>
</head>
<body>

    <h2>Demonstration of Figure, Img, and Figcaption Tags</h2>

    <figure>
        <img src="flower.jpg" alt="A colorful flower" width="300" height="200">
        <figcaption>Fig.1 - A close-up view of a blooming flower in the garden.</figcaption>
    </figure>

</body>
</html>
