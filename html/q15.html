<!DOCTYPE html>
<html>
<head>
    <title>Listing the items using ordered list, unordered list, data definition list.</title>
</head>
<body>

    <table border="0" cellpadding="10" cellspacing="0">
        <tr valign="top">

            <!-- Box 1: Ordered Lists -->
            <td>
                <table border="1" cellpadding="10" cellspacing="0">
                    <tr>
                        <td>
                            <!-- Standard Numbered List -->
                            <ol type="1">
                                <li>Coffee</li>
                                <li>Tea</li>
                                <li>Milk</li>
                            </ol>

                            <br>

                            <!-- Roman Numeral List (I, II, III) -->
                            <ol type="I">
                                <li>Coffee</li>
                                <li>Tea</li>
                                <li>Milk</li>
                            </ol>
                        </td>
                    </tr>
                </table>
            </td>

            <!-- Box 2: Unordered List with Square Bullets -->
            <td>
                <table border="1" cellpadding="10" cellspacing="0">
                    <tr>
                        <td>
                            <ul type="square">
                                <li>Apples</li>
                                <li>Bananas</li>
                                <li>Lemons</li>
                                <li>Oranges</li>
                            </ul>
                        </td>
                    </tr>
                </table>
            </td>

            <!-- Box 3: Description / Definition List -->
            <td>
                <table border="1" cellpadding="10" cellspacing="0">
                    <tr>
                        <td>
                            <dl>
                                <dt>Coffee</dt>
                                <dd>- A black hot drink</dd>
                                <br>
                                <dt>Milk</dt>
                                <dd>- A white cold drink</dd>
                            </dl>
                        </td>
                    </tr>
                </table>
            </td>

        </tr>
    </table>

</body>
</html>
